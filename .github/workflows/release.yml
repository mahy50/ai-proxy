name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        if: github.ref_type == 'tag'
        run: |
          FILE_TAG="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$FILE_TAG" != "${GITHUB_REF_NAME}" ]]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not match VERSION (${FILE_TAG})" >&2
            exit 1
          fi

      - name: Build single-file zipapp and release archive
        run: ./scripts/build.sh

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Smoke test standalone binary
        run: ./dist/ai-proxy --version

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/ai-proxy \
            "dist/ai-proxy-${GITHUB_REF_NAME}.tar.gz" \
            dist/SHA256SUMS \
            --title "ai-proxy ${GITHUB_REF_NAME}" \
            --generate-notes
